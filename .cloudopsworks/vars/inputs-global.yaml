# Global CI/CD variables for the Flutter mobile template.
# Environment-specific files under .cloudopsworks/vars/inputs-<environment>.yaml
# may override these values. The Flutter section below is the source of truth for
# the future ./bp/ci/flutter/config action and is shaped to emit a GitHub Actions
# matrix.include list for Android, iOS, or both in the same workflow.

organization_name: "ORG_NAME"
organization_unit: "ORG_UNIT"
environment_name: "ENV_NAME"
repository_owner: "REPO_OWNER" # Required

# -----------------------------------------------------------------------------
# Flutter build configuration
# -----------------------------------------------------------------------------
flutter:
  # SDK setup. Empty version means use the channel default or runner-installed
  # default chosen by the Flutter setup blueprint.
  channel: "stable"
  version: ""
  project_path: "."
  target: "lib/main.dart"
  build_mode: "release" # debug | profile | release

  # Select build platforms. The Flutter config blueprint should convert this
  # list plus the per-platform matrix settings into build_matrix.include rows.
  # Remove "ios" for Android-only repositories or PR cost control.
  platforms:
    - android
    - ios

  quality:
    pub_get: true
    analyze: true
    test: true
    coverage: false
    formatter_check: false

  # Passed through as repeated --dart-define arguments by the build blueprint.
  # Example:
  # dart_defines:
  #   - API_BASE_URL=https://api.example.com
  dart_defines: []
  extra_args: ""

  # Matrix settings are intentionally not a Cartesian product between Android
  # and iOS. The config blueprint should emit one include row per selected
  # platform/device-output combination.
  matrix:
    fail_fast: false

    # PR defaults may be overridden by environment files or workflow_dispatch.
    pr:
      include_android: true
      include_ios: false # macOS runners are expensive; enable explicitly when needed.

    android:
      enabled: true
      runner_set: "ubuntu-latest"
      sdk: "android"
      destination: "universal"
      configuration: "Release"
      artifact_types:
        - apk
        - appbundle
      deployable_artifact_type: "apk" # device-farm deploy uses a single APK, not AAB.
      split_per_abi: false
      build_args: ""

    ios:
      enabled: true
      runner_set: "macos-latest"
      xcode_version: "16.4"
      scheme: "Runner"
      sdk: "iphoneos"
      destination: "generic/platform=iOS"
      configuration: "Release"
      codesign: false # false creates unsigned smoke builds; true is required for IPA deploy.
      unsigned: true
      export_method: "ad-hoc"
      export_options_plist: ""
      build_for_testing: false
      build_args: ""
      deployable_artifact_type: "ipa" # valid only when codesign=true and an IPA is produced.

