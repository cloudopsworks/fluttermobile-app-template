# -----------------------------------------------------------------------------
# Preview configuration.
# Mobile preview is intentionally disabled by default. The existing CloudOpsWorks
# preview model is Kubernetes/container-oriented; define a mobile-specific
# distribution/test-lab preview before enabling this for Flutter mobile apps.
# -----------------------------------------------------------------------------
preview:
  enabled: false

