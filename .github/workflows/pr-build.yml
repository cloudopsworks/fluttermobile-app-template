name: Build Pull Request
run-name: 'Build Pull Request - Branch: ${{ github.ref_name }}'
on:
  pull_request:
    types:
      - opened
      - synchronize
      - edited
    branches:
      - hotfix/**
      - feature/**
      - master
      - release/**
      - support/**
      - develop

concurrency: build-pull-${{ github.repository }}-${{ github.ref }}

permissions:
  actions: write
  contents: write
  packages: write
  statuses: write
  pull-requests: write
  issues: write
  checks: write

jobs:
  check-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout w/Blueprint
        uses: cloudopsworks/blueprints/cd/checkout@v5.10
        with:
          source_ref: ${{ github.head_ref }}
          blueprint_ref: 'v5.10'

      - name: Pipeline Configuration
        id: config
        uses: ./bp/ci/config

      - name: Check Pull Requests
        uses: ./bp/cd/tasks/repo/checkpr
        with:
          token: ${{ secrets.BOT_TOKEN }}

  preload:
    name: 'Preload - Branch: ${{ github.ref_name }}'
    runs-on: ubuntu-latest
    if: |
      (! startsWith(github.head_ref, 'release/')) &&
      (! startsWith(github.head_ref,'support/')) &&
      (! startsWith(github.head_ref,'master'))
    outputs:
      is_release: ${{ steps.config.outputs.is_release }}
      is_pre_release: ${{ steps.config.outputs.is_pre_release }}
      semver: ${{ steps.version.outputs.semver }}
      deployment_name: ${{ steps.config.outputs.deployment_name }}
      deployment_enabled: ${{ steps.config.outputs.deployment_enabled }}
      cloud: ${{ steps.config.outputs.cloud }}
      cloud_type: ${{ steps.config.outputs.cloud_type }}
      runner_set: ${{ steps.config.outputs.runner_set != '' && steps.config.outputs.runner_set || vars.PREVIEW_RUNNER_SET }}
      project_key: ${{ steps.config.outputs.project_key }}
      project_owner: ${{ steps.config.outputs.project_owner }}
      environment: ${{ steps.config.outputs.environment }}
      has_preview: ${{ steps.config.outputs.has_preview }}
      flutter_channel: ${{ steps.flutter.outputs.flutter_channel }}
      flutter_version: ${{ steps.flutter.outputs.flutter_version }}
      flutter_project_path: ${{ steps.flutter.outputs.flutter_project_path }}
      flutter_target: ${{ steps.flutter.outputs.flutter_target }}
      flutter_build_mode: ${{ steps.flutter.outputs.flutter_build_mode }}
      build_matrix: ${{ steps.flutter.outputs.build_matrix }}
      matrix_fail_fast: ${{ steps.flutter.outputs.matrix_fail_fast }}
      quality_enabled: ${{ steps.flutter.outputs.quality_enabled }}
      analyze_enabled: ${{ steps.flutter.outputs.analyze_enabled }}
      test_enabled: ${{ steps.flutter.outputs.test_enabled }}
      coverage_enabled: ${{ steps.flutter.outputs.coverage_enabled }}
      formatter_check_enabled: ${{ steps.flutter.outputs.formatter_check_enabled }}
      dart_defines_json: ${{ steps.flutter.outputs.dart_defines_json }}
      flutter_extra_args: ${{ steps.flutter.outputs.flutter_extra_args }}
      linux_runner_set: ${{ steps.flutter.outputs.linux_runner_set }}
    steps:
      - name: Checkout w/Blueprint
        id: co
        uses: cloudopsworks/blueprints/cd/checkout@v5.10
        with:
          source_ref: ${{ github.head_ref }}
          blueprint_ref: 'v5.10'

      - name: Pipeline Configuration
        id: config
        uses: ./bp/ci/config

      - name: Flutter Configuration
        id: flutter
        uses: ./bp/ci/flutter/config
        with:
          environment: ${{ steps.config.outputs.environment }}
          is_pull_request: 'true'

      - name: Resolve Version
        id: version
        shell: bash
        working-directory: ${{ steps.co.outputs.source_path }}
        run: |
          set -euo pipefail
          if [[ -f Makefile ]]; then make version >/tmp/flutter-version.log 2>&1 || cat /tmp/flutter-version.log; fi
          if [[ -f VERSION ]]; then semver=$(tr -d '[:space:]' < VERSION); else semver=$(yq e '.version // "0.0.0+0"' pubspec.yaml | cut -d+ -f1); fi
          echo "semver=$semver" >> "$GITHUB_OUTPUT"

  quality:
    name: 'Flutter Quality - Branch: ${{ github.ref_name }}'
    needs: [preload]
    if: ${{ needs.preload.outputs.quality_enabled == 'true' }}
    runs-on: ${{ needs.preload.outputs.linux_runner_set }}
    steps:
      - name: Checkout w/Blueprint
        uses: cloudopsworks/blueprints/cd/checkout@v5.10
        with:
          source_ref: ${{ github.head_ref }}
          blueprint_ref: 'v5.10'

      - name: Setup Flutter
        uses: ./bp/ci/flutter/setup
        with:
          flutter_channel: ${{ needs.preload.outputs.flutter_channel }}
          flutter_version: ${{ needs.preload.outputs.flutter_version }}
          platform_type: common

      - name: Run Quality Checks
        uses: ./bp/ci/flutter/quality
        with:
          project_path: ${{ needs.preload.outputs.flutter_project_path }}
          target: ${{ needs.preload.outputs.flutter_target }}
          analyze_enabled: ${{ needs.preload.outputs.analyze_enabled }}
          test_enabled: ${{ needs.preload.outputs.test_enabled }}
          coverage_enabled: ${{ needs.preload.outputs.coverage_enabled }}
          formatter_check_enabled: ${{ needs.preload.outputs.formatter_check_enabled }}

  build:
    name: 'Flutter ${{ matrix.platform_type }} PR Build - Branch: ${{ github.ref_name }}'
    needs: [preload, quality]
    if: |
      (! cancelled()) &&
      (needs.preload.result == 'success') &&
      (needs.quality.result == 'success' || needs.quality.result == 'skipped')
    strategy:
      fail-fast: ${{ fromJSON(needs.preload.outputs.matrix_fail_fast) }}
      matrix: ${{ fromJSON(needs.preload.outputs.build_matrix) }}
    runs-on: ${{ matrix.runner_set }}
    steps:
      - name: Checkout w/Blueprint
        uses: cloudopsworks/blueprints/cd/checkout@v5.10
        with:
          source_ref: ${{ github.head_ref }}
          blueprint_ref: 'v5.10'

      - name: Setup Flutter
        uses: ./bp/ci/flutter/setup
        with:
          flutter_channel: ${{ needs.preload.outputs.flutter_channel }}
          flutter_version: ${{ needs.preload.outputs.flutter_version }}
          platform_type: ${{ matrix.platform_type }}

      - name: Build Flutter Project
        id: build
        uses: ./bp/ci/flutter/build
        with:
          bot_user: ${{ vars.BOT_USER }}
          token: ${{ secrets.BOT_TOKEN }}
          project_key: ${{ needs.preload.outputs.project_key }}
          semver_override: ${{ needs.preload.outputs.semver }}
          project_path: ${{ needs.preload.outputs.flutter_project_path }}
          platform_type: ${{ matrix.platform_type }}
          flutter_target: ${{ needs.preload.outputs.flutter_target }}
          flutter_build_mode: ${{ needs.preload.outputs.flutter_build_mode }}
          dart_defines_json: ${{ needs.preload.outputs.dart_defines_json }}
          flutter_extra_args: ${{ needs.preload.outputs.flutter_extra_args }}
          android_artifact_types: ${{ toJSON(matrix.artifact_types) }}
          android_split_per_abi: ${{ matrix.android_split_per_abi || 'false' }}
          android_build_args: ${{ matrix.android_build_args || '' }}
          android_sdk: ${{ matrix.android_sdk || 'android' }}
          android_destination: ${{ matrix.android_destination || 'universal' }}
          ios_codesign: ${{ matrix.ios_codesign || 'false' }}
          ios_export_method: ${{ matrix.ios_export_method || 'ad-hoc' }}
          ios_export_options_plist: ${{ matrix.ios_export_options_plist || '' }}
          ios_scheme: ${{ matrix.xcode_scheme || 'Runner' }}
          ios_sdk: ${{ matrix.xcode_sdk || 'iphoneos' }}
          ios_destination: ${{ matrix.xcode_destination || 'generic/platform=iOS' }}
          ios_configuration: ${{ matrix.xcode_configuration || 'Release' }}
          build_certificate_b64: ${{ secrets.XCODE_BUILD_CERTIFICATE_BASE64 }}
          build_certificate_pass: ${{ secrets.XCODE_BUILD_CERTIFICATE_PASS }}
          build_provision_profile_b64: ${{ secrets.XCODE_PROVISION_PROFILE_BASE64 }}
          keychain_password: ${{ secrets.XCODE_KEYCHAIN_PASSWORD }}
          build_export_options_plist: ${{ secrets.XCODE_EXPORT_OPTIONS_PLIST }}

      - name: Save Build Artifacts
        uses: ./bp/ci/flutter/artifacts
        with:
          project_path: ${{ needs.preload.outputs.flutter_project_path }}
          platform_type: ${{ matrix.platform_type }}
          artifact_paths_json: ${{ steps.build.outputs.artifact_paths_json }}
          workflow_artifact_name: ${{ steps.build.outputs.workflow_artifact_name }}
          target_artifact_name: ${{ steps.build.outputs.target_artifact_name }}
          artifact_manifest_path: ${{ steps.build.outputs.artifact_manifest_path }}

  scan:
    name: 'Code Scan SAST/SCA/DAST'
    needs: [preload, build]
    if: |
      (! cancelled()) &&
      (needs.preload.result == 'success') &&
      (needs.build.result == 'success')
    uses: ./.github/workflows/scan.yml
    with:
      deployment_name: ${{ needs.preload.outputs.deployment_name }}
      semver: ${{ needs.preload.outputs.semver }}
      bot_user: ${{ vars.BOT_USER }}
      sonarqube_url: ${{ vars.SONARQUBE_URL }}
      dtrack_url: ${{ vars.DEPENDENCYTRACK_URL }}
      default_runner_set: ${{ vars.DEPLOYMENT_RUNNER_SET }}
      environment: ${{ needs.preload.outputs.environment }}
      is_preview: true
    secrets:
      token: ${{ secrets.BOT_TOKEN }}
      sonarqube_token: ${{ secrets.SONARQUBE_TOKEN }}
      snyk_token: ${{ secrets.SNYK_TOKEN }}
      semgrep_token: ${{ secrets.SEMGREP_TOKEN }}
      dtrack_token: ${{ secrets.DEPENDENCYTRACK_TOKEN }}
