# README-TEMPLATE.yaml
# This file documents fluttermobile-app-template for repositories created from it.
# It is reference documentation, not runtime configuration. Application teams should
# update README.md for the actual product while keeping this guide as the template runbook.

template:
  name: fluttermobile-app-template
  title: Flutter Mobile App Template Usage Guide
  repository: https://github.com/cloudopsworks/fluttermobile-app-template
  current_version_file: .cloudopsworks/_VERSION
  marker_file: .cloudopsworks/.fluttermobile
  blueprint_channel: v5.10
  description: >
    Starter template for Flutter applications targeting Android and iOS with the
    Cloud Ops Works GitHub Actions, GitVersion, Tronador, and mobile device-farm
    deployment conventions. The template supports Android-only, iOS-only, or
    combined Android+iOS matrix builds from the same workflow configuration.
  intended_audience:
    - Mobile application teams creating a new Flutter repository.
    - Platform engineers maintaining CI/CD workflow standards.
    - Release engineers validating Android and iOS artifact generation and deployment.

what_this_template_gives_you:
  - Flutter application skeleton with Android and iOS platform folders.
  - Cloud Ops Works CI/CD metadata under .cloudopsworks/.
  - GitHub Actions workflows under .github/workflows/ for PR validation, release builds, deploys, scans, ownership processing, and environment cleanup.
  - Matrix-driven Flutter build configuration for Android APK/AAB and signed or unsigned iOS outputs.
  - Optional AWS Device Farm or GCP Firebase Test Lab deployment configuration.
  - GitVersion and Makefile helpers through Tronador.
  - Optional Snyk, Semgrep, SonarQube, DependencyTrack, and JIRA integration hooks.
  - A stable template marker consumed by cd/checkout/check-module-version.

repository_layout:
  description: Top-level structure expected in repositories derived from this template.
  tree:
    .cloudopsworks/:
      .fluttermobile: Marker file used by Cloud Ops Works checkout/version actions.
      _VERSION: Template version last applied to the repository.
      cloudopsworks-ci.yaml: Repository governance, branch policy, and CD trigger configuration.
      labeler.yml: Labeling rules consumed by platform workflows.
      Makefile: Cloud Ops Works helper targets.
      vars/:
        inputs-global.yaml: Shared Flutter, quality, matrix, cloud, and integration settings.
        inputs-dev.yaml: Development environment overrides and deployment settings.
        inputs-uat.yaml: UAT environment overrides and deployment settings.
        inputs-prod.yaml: Production environment overrides and deployment settings.
    .github/workflows/:
      pr-build.yml: Pull-request quality and platform build workflow.
      main-build.yml: Main/develop release build, artifact, scan, and deploy workflow.
      deploy.yml: Environment deployment workflow.
      scan.yml: SAST/SCA/DAST scan workflow.
      process-owners.yml: CODEOWNERS/reviewer processing workflow.
      jira-integration.yml: JIRA release lifecycle integration.
      pr-close.yaml: PR cleanup workflow.
      environment-destroy.yml: Destroy named environments.
      environment-unlock.yml: Unlock named deployment environments.
      patch-management.yml: Dependency/security patch management workflow.
    android/: Flutter Android platform project.
    ios/: Flutter iOS platform project.
    lib/: Flutter/Dart application source.
    test/: Flutter tests.
    Makefile: Project initialization and version helper targets.
    pubspec.yaml: Flutter package name, dependencies, and app version.
    README.md: Application README to replace with product-specific documentation.
    README-TEMPLATE.yaml: This template usage guide.

quick_start:
  create_repository:
    description: Create a new private repository from this template in GitHub.
    recommended_owner: cloudopsworks
    steps:
      - Use GitHub's "Use this template" flow or gh repo create with the template option.
      - Clone the new repository locally.
      - Start from the develop branch when using GitFlow.
    example_commands:
      - git clone git@github.com:cloudopsworks/<your-app-repo>.git
      - cd <your-app-repo>
      - make gitflow/init
      - git checkout develop

  initialize_project_metadata:
    description: >
      Initialize the Flutter package name and version metadata after cloning.
      The root Makefile uses GitVersion and yq through Tronador.
    command: make code/init
    updates:
      - pubspec.yaml:name
      - pubspec.yaml:version
    prerequisites:
      - gh CLI authenticated to the GitHub organization.
      - GitVersion available through Tronador or installed locally.
      - yq available through Tronador or installed locally.

  replace_sample_application:
    description: >
      Replace the bundled sample screens with the real Flutter application code.
      Keep the Android/iOS platform folders unless intentionally regenerating them.
    typical_changes:
      - Update lib/ with the product app source.
      - Update test/ with product tests.
      - Update pubspec.yaml dependencies, assets, package name, and description.
      - Update android/app/build.gradle.kts applicationId and signing settings as needed.
      - Update ios/Runner.xcodeproj bundle identifiers, team IDs, entitlements, and capabilities.
      - Update README.md with product-specific runbooks and support information.

  optional_regenerate_flutter_app:
    description: >
      Use only when intentionally replacing the sample Flutter project structure.
      Preserve .cloudopsworks/ and .github/workflows/.
    commands:
      - rm -rf lib test
      - flutter create --org com.cloudopsworks --project-name <project_name> --platforms android,ios .
      - make code/init

versioning_and_release_model:
  template_version:
    file: .cloudopsworks/_VERSION
    meaning: Last template release applied to this repository.
    upgrade_command: make repos/upgrade
    note: >
      The current Cloud Ops Works upgrade tooling may need marker support for
      .fluttermobile. If a legacy upgrade target does not recognize the marker,
      platform maintainers should update Tronador rather than adding permanent
      Android or Xcode compatibility markers to application repositories.

  gitversion:
    description: >
      The template is designed for GitFlow usage in Cloud Ops Works repositories,
      with work starting from develop and releases flowing through pull requests
      and patch/minor/major semver annotations.
    patch_release_annotation: "+semver: patch"
    recommended_commit_style: "Conventional Commits, for example: fix: ... +semver: patch."
    avoid_for_patch_work:
      - "+semver: minor"
      - "+semver: major"
      - "+semver: breaking"

blueprint_pins:
  policy:
    description: >
      Workflow files should use the v5.10 blueprint channel, not patch-specific
      tags, so repositories receive compatible patch fixes from blueprints without
      requiring a template release for every blueprint patch.
    required_values:
      action_ref: cloudopsworks/blueprints/cd/checkout@v5.10
      blueprint_ref: v5.10
    validation_commands:
      - grep -R "cloudopsworks/blueprints/cd/checkout@" .github/workflows
      - grep -R "blueprint_ref:" .github/workflows

flutter_configuration:
  primary_file: .cloudopsworks/vars/inputs-global.yaml
  description: >
    inputs-global.yaml is the main configuration surface for build matrix,
    quality checks, Android outputs, iOS outputs, and optional integrations.

  core_fields:
    organization_name: Organization name used by Cloud Ops Works pipelines.
    organization_unit: Business unit or team owning the application.
    environment_name: Logical repository/application environment name.
    repository_owner: GitHub owner or organization for this repository.

  flutter_section:
    channel: Flutter channel, usually stable.
    version: Optional exact Flutter SDK version; empty means blueprint/default runner version.
    project_path: Flutter project path relative to repository root, normally ".".
    target: Main Dart entrypoint, normally lib/main.dart.
    build_mode: debug, profile, or release.
    platforms: List containing android, ios, or both.
    quality:
      pub_get: Run flutter pub get.
      analyze: Run flutter analyze.
      test: Run flutter test.
      coverage: Collect test coverage when enabled.
      formatter_check: Run formatter check when enabled.
    dart_defines: List of KEY=VALUE entries passed as --dart-define.
    extra_args: Extra Flutter CLI arguments shared across platforms.

matrix_builds:
  description: >
    The workflows use a matrix.include shape, not a raw Cartesian product. Each
    platform row describes a complete Android or iOS build target. This keeps
    Android and iOS settings independent while allowing one workflow dispatch to
    build both outputs.
  selection:
    android_only:
      flutter.platforms: [android]
      workflow_dispatch_platforms: android
    ios_only:
      flutter.platforms: [ios]
      workflow_dispatch_platforms: ios
    android_and_ios:
      flutter.platforms: [android, ios]
      workflow_dispatch_platforms: android,ios
  pr_defaults:
    description: >
      PR builds should usually include Android and optionally iOS because macOS
      runners are more expensive. Enable iOS PR builds only when the repository
      requires signed or platform-specific iOS validation on every PR.
    fields:
      flutter.matrix.pr.include_android: true
      flutter.matrix.pr.include_ios: false

android_configuration:
  location: .cloudopsworks/vars/inputs-global.yaml#flutter.matrix.android
  fields:
    enabled: Enable Android matrix row generation.
    runner_set: Runner label, normally ubuntu-latest.
    sdk: Android deployment dimension, usually android.
    destination: Artifact/deployment destination label, usually universal.
    configuration: Build configuration label, usually Release.
    artifact_types: List of apk and/or appbundle.
    deployable_artifact_type: Single artifact type used by device-farm deploy, normally apk.
    split_per_abi: Build split APKs per ABI when true.
    build_args: Extra Android-specific Flutter build arguments.
  outputs:
    apk: build/app/outputs/flutter-apk/*.apk
    appbundle: build/app/outputs/bundle/**/*.aab
  deployment_notes:
    - AWS Device Farm expects an APK for Android app uploads.
    - AAB can be produced for store publishing but is not the default device-farm deployable artifact.

ios_configuration:
  location: .cloudopsworks/vars/inputs-global.yaml#flutter.matrix.ios
  fields:
    enabled: Enable iOS matrix row generation.
    runner_set: Runner label, normally macos-latest.
    xcode_version: Xcode version selected by the setup action.
    scheme: Xcode scheme, usually Runner for default Flutter apps.
    sdk: iphoneos for device/archive builds.
    destination: generic/platform=iOS for archive builds.
    configuration: Xcode configuration, usually Release.
    codesign: true for signed IPA builds; false for unsigned smoke builds.
    unsigned: true for unsigned smoke builds; false for signed deployable IPA builds.
    export_method: ad-hoc, app-store, enterprise, or development.
    export_options_plist: Optional path to a custom ExportOptions.plist.
    build_for_testing: Enable when creating XCTest-compatible artifacts.
    build_args: Extra iOS-specific Flutter build arguments.
    deployable_artifact_type: ipa when codesign is true and an IPA is produced.
  signing_requirements:
    - APPLE_BUILD_CERTIFICATE_BASE64 or equivalent organization/repository secret.
    - APPLE_BUILD_CERTIFICATE_PASSWORD secret.
    - APPLE_BUILD_PROVISION_PROFILE_BASE64 secret matching the bundle identifier.
    - APPLE_KEYCHAIN_PASSWORD secret or generated temporary password.
    - Bundle identifier in ios/Runner.xcodeproj must match the provisioning profile.
    - DEVELOPMENT_TEAM should match the Apple Developer Team ID.
  outputs:
    signed_ipa: build/ios/ipa/*.ipa
    unsigned_smoke_zip: build/ios/smoke/unsigned-ios-app.zip

per_environment_inputs:
  location: .cloudopsworks/vars/inputs-<environment>.yaml
  recommended_files:
    - inputs-dev.yaml
    - inputs-uat.yaml
    - inputs-prod.yaml
  template_placeholders:
    - inputs-ANDROID-ENV.yaml
    - inputs-XCODE-ENV.yaml
  guidance: >
    Real repositories should keep only the environments they deploy. Template
    placeholder files document available settings but should not be used as live
    environments without replacing placeholder values.
  common_fields:
    environment: Environment name such as dev, uat, or prod.
    disable_deploy: Set true to skip deploy for an environment.
    runner_set: Optional environment-specific runner override.
    aws: AWS Device Farm settings and STS role configuration.
    gcp: Firebase Test Lab settings and credentials configuration.

cloud_deployment:
  global_fields:
    cloud: aws or gcp.
    cloud_type: device-farm for AWS Device Farm or firebase-test-lab for GCP.
    runner_set: Default deployment runner when not supplied per platform/environment.
  aws_device_farm:
    required:
      - aws.region
      - aws.project_name or existing Device Farm project mapping.
      - aws.sts_role_arn or deploy_sts_role_arn with Device Farm permissions.
      - Per-platform devices or pools in inputs-<environment>.yaml.
    artifact_types:
      android: ANDROID_APP APK.
      ios: IOS_APP IPA.
  gcp_firebase_test_lab:
    required:
      - GCP project ID.
      - Service account credentials or workload identity configuration.
      - Per-platform device definitions.
    artifact_types:
      android: APK.
      ios: IPA or XCTest-compatible artifact depending on test mode.

workflow_usage:
  pr_build:
    workflow: .github/workflows/pr-build.yml
    purpose: Validate pull requests with quality checks and configured platform builds.
  main_build:
    workflow: .github/workflows/main-build.yml
    purpose: Build release artifacts, upload workflow artifacts, run scans, and deploy when enabled.
    manual_dispatch_input:
      platforms: android, ios, or android,ios.
  deploy:
    workflow: .github/workflows/deploy.yml
    purpose: Deploy previously built mobile artifacts to configured device farms.
  process_owners:
    workflow: .github/workflows/process-owners.yml
    purpose: Validate/reconcile ownership and reviewer rules after configuration changes.
  scan:
    workflow: .github/workflows/scan.yml
    purpose: Run security and dependency scanning.

local_development:
  commands:
    install_dependencies: flutter pub get
    analyze: flutter analyze
    test: flutter test
    android_release_apk: flutter build apk --release
    android_release_aab: flutter build appbundle --release
    ios_unsigned_smoke: flutter build ios --release --no-codesign
  notes:
    - iOS device/archive builds require macOS with Xcode and matching iOS SDKs.
    - Signed IPA creation requires Apple certificate and provisioning profile secrets in CI.
    - Local generated files under build/, .dart_tool/, and ios/build/ should not be committed.

customization_checklist:
  required_before_first_ci_run:
    - Replace ORG_NAME, ORG_UNIT, ENV_NAME, and REPO_OWNER placeholders.
    - Set flutter.platforms to android, ios, or both.
    - Choose Android artifact types and deployable artifact type.
    - Set iOS bundle identifier, team ID, signing mode, and export method.
    - Configure inputs-dev.yaml, inputs-uat.yaml, and inputs-prod.yaml as needed.
    - Configure cloud and cloud_type only when deployment is expected.
    - Add required GitHub organization/repository secrets for signing and cloud deploy.
    - Run make code/init.
    - Run flutter pub get, flutter analyze, and flutter test locally.
  required_before_ios_deploy:
    - Confirm ios/Runner.xcodeproj PRODUCT_BUNDLE_IDENTIFIER matches provisioning profile.
    - Confirm DEVELOPMENT_TEAM matches the certificate/profile team.
    - Set flutter.matrix.ios.codesign to true.
    - Set flutter.matrix.ios.unsigned to false.
    - Provide signing certificate, certificate password, provisioning profile, and keychain secrets.
  required_before_android_deploy:
    - Confirm Android package/applicationId is final.
    - Produce a single deployable APK unless the deploy workflow is explicitly adapted for split APKs.
    - Configure Device Farm/Firebase devices for the target environment.

upgrade_procedure:
  description: Keep derived repositories synchronized with the latest template patch release.
  normal_command: make repos/upgrade
  expected_results:
    - .cloudopsworks/_VERSION updates to the latest compatible template tag.
    - .github/workflows/ are refreshed from the template.
    - Makefile and selected Cloud Ops Works metadata are refreshed.
    - Existing application source under lib/, test/, android/, and ios/ is preserved unless explicitly changed by the template tooling.
  validation_after_upgrade:
    - ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}", ".cloudopsworks/**/*.yaml"].each { |f| YAML.load_file(f) }; puts "yaml-ok"'
    - grep -R "cloudopsworks/blueprints/cd/checkout@v5.10" .github/workflows
    - flutter pub get
    - flutter analyze
    - flutter test
  commit_guidance:
    format: Conventional Commit
    example: "chore: upgrade from fluttermobile template v1.0.10 +semver: patch"

troubleshooting:
  checkout_marker_not_found:
    symptoms:
      - No module marker file found in .cloudopsworks directory.
      - The checkout action tries to query https://github.com/.git.
    checks:
      - Confirm .cloudopsworks/.fluttermobile exists.
      - Confirm workflows use cloudopsworks/blueprints/cd/checkout@v5.10.
      - Confirm blueprint_ref is v5.10.
  android_build_fails:
    checks:
      - Run flutter doctor -v.
      - Run flutter pub get.
      - Validate android/app/build.gradle.kts applicationId and SDK settings.
      - Confirm requested artifact_types are apk and/or appbundle.
  ios_build_fails:
    checks:
      - Confirm the runner has the requested Xcode version.
      - Confirm ios/Runner.xcodeproj exists; Runner.xcworkspace is optional for default Flutter apps.
      - Confirm signing secrets and provisioning profile match the bundle identifier.
      - For smoke builds set codesign=false and unsigned=true.
  deploy_cannot_find_artifact:
    checks:
      - Confirm Android build produced an APK when deployable_artifact_type is apk.
      - Confirm iOS signed build produced an IPA when deployable_artifact_type is ipa.
      - Confirm workflows use the v5.10 blueprint channel with mobile deploy nested artifact lookup fixes.
  device_farm_upload_fails:
    checks:
      - Confirm AWS/GCP credentials and role permissions.
      - Confirm cloud_type matches provider-specific deploy action.
      - Confirm environment input file contains platform-specific device configuration.

maintenance_policy:
  simplicity:
    - Prefer inputs-global.yaml and per-environment overrides over workflow edits.
    - Keep Android and iOS matrix rows explicit instead of generating hidden Cartesian products.
    - Avoid sample-only fixes; reusable CI behavior belongs in blueprints or the template.
  reuse:
    - Shared GitHub Action behavior belongs in cloudopsworks/blueprints.
    - Repository scaffolding and default workflow configuration belong in this template.
    - Application-specific bundle IDs, signing profiles, and deployment targets belong in derived repositories.
  maintainability:
    - Keep workflow blueprint refs on v5.10 unless intentionally moving to another minor channel.
    - Remove unused demo/staging environment files from derived repositories.
    - Keep commits conventional and include +semver: patch for patch-only releases.
    - Validate YAML and run at least Flutter analyze/test before claiming an upgrade complete.
